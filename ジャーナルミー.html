<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="journal">
<meta name="theme-color" content="#C8A8D8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
<title>journal</title>
<style>
:root{
  --grad-start:#A898BC;
  --grad-mid:#BC8898;
  --grad-end:#C87D6A;
  --glass:#FFFFFF;
  --glass-border:rgba(255,255,255,0.6);
  --glass-shadow:rgba(180,120,160,0.15);
  --surface:#FFFFFF;
  --surface2:rgba(255,255,255,0.6);
  --text:#2A1830;
  --text-sub:#6A4860;
  --text-muted:#B898B0;
  --text-on-grad:#FFFFFF;
  --text-on-grad-sub:rgba(255,255,255,0.75);
  --accent:#9A6090;
  --accent-bg:rgba(192,96,160,0.1);
  --coral:#B86858;
  --coral-bg:rgba(224,112,96,0.1);
  --border:rgba(180,120,160,0.15);
  --radius:18px;--radius-sm:12px;
  --font:'Noto Serif JP',Georgia,serif
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:var(--font);color:var(--text)}
body{background:linear-gradient(160deg,var(--grad-start) 0%,var(--grad-mid) 50%,var(--grad-end) 100%);background-attachment:fixed}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:480px;margin:0 auto}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;display:none;-webkit-overflow-scrolling:touch;padding-bottom:88px}
.screen.active{display:block}

/* ヘッダー：グラデーション上に透明で乗せる */
.page-header{padding:56px 22px 20px}
.page-header h1{font-size:28px;font-weight:500;color:var(--text-on-grad);letter-spacing:-0.2px;line-height:1.2}
.page-header .sub{font-size:12px;color:var(--text-on-grad-sub);margin-top:5px;font-weight:300;letter-spacing:0.06em}

/* グラスカード */
.card{background:rgba(252,248,244,0.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:var(--radius);border:1px solid rgba(255,255,255,0.55);margin:12px 16px 0;padding:16px;box-shadow:0 4px 24px rgba(140,90,100,0.12)}
.card-label{font-size:10px;font-weight:400;color:var(--text-muted);letter-spacing:0.1em;margin-bottom:12px}

/* 気分ボタン */
.mood-row{display:flex;gap:7px}
.mood-btn{flex:1;height:58px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,0.5);background:rgba(255,255,255,0.4);cursor:pointer;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 2px;backdrop-filter:blur(8px)}
.mood-icon-wrap{width:28px;height:28px}
.mood-icon-wrap svg{width:28px;height:28px}
.mood-label{font-size:9px;color:var(--text-muted);font-family:var(--font);letter-spacing:0.02em}
.mood-btn.sel{border:1.5px solid rgba(255,255,255,0.9);background:rgba(255,255,255,0.75);transform:translateY(-3px);box-shadow:0 4px 14px rgba(140,80,110,0.15)}
.mood-btn.sel .mood-label{color:var(--accent);font-weight:500}

/* モード */
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode-btn{padding:12px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,0.5);background:rgba(255,255,255,0.4);font-size:12px;color:var(--text-sub);cursor:pointer;display:flex;align-items:center;gap:8px;font-family:var(--font);font-weight:300;letter-spacing:0.03em;transition:all 0.15s;backdrop-filter:blur(8px)}
.mode-pip{width:7px;height:7px;border-radius:50%;background:var(--text-muted);flex-shrink:0;transition:all 0.15s}
.mode-btn.sel{background:rgba(255,255,255,0.75);border-color:rgba(255,255,255,0.9);color:var(--accent)}
.mode-btn.sel .mode-pip{background:var(--accent)}

/* テキストエリア */
.journal-textarea{width:100%;border:none;background:transparent;font-size:15px;font-family:var(--font);font-weight:300;color:var(--text);line-height:1.85;resize:none;min-height:150px;outline:none}
.journal-textarea::placeholder{color:var(--text-muted);font-weight:300}

/* 保存ボタン */
.btn-save{width:calc(100% - 32px);margin:14px 16px 0;padding:15px;border-radius:var(--radius);background:linear-gradient(135deg,#9A7090 0%,#B07068 100%);color:#fff;font-size:14px;font-weight:400;font-family:var(--font);border:none;cursor:pointer;letter-spacing:0.06em;box-shadow:0 4px 16px rgba(140,80,100,0.25);transition:all 0.15s}
.btn-save:active{opacity:0.85;transform:scale(0.99)}

/* On This Day */
.otd-inner{background:rgba(255,255,255,0.5);border-radius:var(--radius-sm);padding:12px 14px;border-left:3px solid rgba(192,96,160,0.5)}
.otd-date{font-size:10px;color:var(--accent);letter-spacing:0.06em;margin-bottom:5px}
.otd-text{font-size:13px;color:var(--text-sub);line-height:1.75;font-weight:300}

/* AIカード */
.ai-card{background:rgba(252,248,244,0.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:var(--radius);border:1px solid rgba(255,255,255,0.55);padding:18px;margin:12px 16px 0;display:none;box-shadow:0 4px 24px rgba(140,90,100,0.12)}
.ai-header{font-size:10px;color:var(--accent);font-weight:500;margin-bottom:14px;display:flex;align-items:center;gap:8px;letter-spacing:0.1em}
.ai-header-line{flex:1;height:0.5px;background:linear-gradient(to right,var(--accent),transparent);opacity:0.4}
.ai-body{font-size:14px;color:var(--text);line-height:1.85;font-weight:300}
.ai-question{font-size:14px;color:var(--accent);font-weight:400;margin-top:14px;line-height:1.7;padding-top:14px;border-top:0.5px solid rgba(192,96,160,0.2)}
.ai-reply{margin-top:12px}
.ai-reply textarea{width:100%;border:1px solid rgba(192,96,160,0.2);border-radius:var(--radius-sm);background:rgba(255,255,255,0.5);padding:10px 12px;font-size:14px;font-family:var(--font);font-weight:300;color:var(--text);resize:none;min-height:72px;outline:none;line-height:1.7}
.ai-reply-btn{margin-top:8px;padding:10px 22px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--accent),var(--coral));color:#fff;font-size:13px;font-family:var(--font);border:none;cursor:pointer;letter-spacing:0.06em;box-shadow:0 4px 14px rgba(192,96,160,0.3)}
.ai-loading{display:flex;gap:6px;align-items:center;padding:6px 0}
.ai-loading span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:dot 1.2s infinite}
.ai-loading span:nth-child(2){animation-delay:0.2s}
.ai-loading span:nth-child(3){animation-delay:0.4s}
@keyframes dot{0%,80%,100%{opacity:.2}40%{opacity:1}}

/* カレンダーヘッダー */
.cal-header{display:flex;align-items:center;justify-content:space-between;padding:56px 20px 20px}
.cal-header h1{font-size:22px;font-weight:500;color:var(--text-on-grad);letter-spacing:-0.2px}
.cal-nav-btn{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,0.5);background:rgba(255,255,255,0.25);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin:12px 16px 4px}
.cal-weekday{text-align:center;font-size:10px;color:rgba(255,255,255,0.6);padding:4px 0;letter-spacing:0.06em}
.cal-cells{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:0 16px}
.cal-cell{aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.cal-cell .cn{font-size:11px;color:rgba(255,255,255,0.75);line-height:1;font-weight:300}
.cal-cell .cm{font-size:11px;line-height:1;margin-top:1px}
.cal-cell.today{background:rgba(255,255,255,0.3);backdrop-filter:blur(8px)}
.cal-cell.today .cn{color:#fff;font-weight:500}
.cal-cell.has-entry .cn{color:#fff}

/* チャート */
.chart-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.chart-label{font-size:10px;color:var(--text-muted);width:18px;flex-shrink:0;font-weight:300}
.chart-track{flex:1;height:16px;border-radius:4px;background:rgba(255,255,255,0.3);overflow:hidden;display:flex}
.chart-pos{background:linear-gradient(to right,var(--accent),var(--coral));height:100%;opacity:0.7}
.chart-neg{background:rgba(100,60,80,0.2);height:100%}
.chart-icon{width:22px;flex-shrink:0;text-align:center;font-size:12px}

/* レポートヘッダー */
.report-header{padding:56px 22px 20px}
.report-header h1{font-size:26px;font-weight:500;color:var(--text-on-grad);letter-spacing:-0.2px}
.report-header .sub{font-size:11px;color:var(--text-on-grad-sub);margin-top:5px;font-weight:300;letter-spacing:0.08em}

/* ワードクラウド */
.wordcloud{display:flex;flex-wrap:wrap;gap:7px;align-items:center;min-height:90px;padding:4px 0}
.wc-bubble{display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:default;flex-shrink:0;font-family:var(--font)}
.wc-bubble:nth-child(3n+1){background:rgba(192,96,160,0.12);border:1px solid rgba(192,96,160,0.25);color:var(--accent)}
.wc-bubble:nth-child(3n+2){background:rgba(224,112,96,0.12);border:1px solid rgba(224,112,96,0.25);color:var(--coral)}
.wc-bubble:nth-child(3n){background:rgba(200,168,220,0.2);border:1px solid rgba(200,168,220,0.4);color:#906080}

/* ポップアップ */
.popup-bg{position:fixed;inset:0;background:rgba(40,12,36,0.45);backdrop-filter:blur(4px);z-index:200;display:none;align-items:flex-end;justify-content:center}
.popup-bg.show{display:flex}
.popup{background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);border-radius:22px 22px 0 0;width:100%;max-width:480px;padding:20px 22px calc(24px + env(safe-area-inset-bottom));max-height:72vh;overflow-y:auto;border-top:1px solid rgba(255,255,255,0.8)}
.popup-handle{width:32px;height:3px;border-radius:2px;background:rgba(180,120,160,0.25);margin:0 auto 18px}
.popup-date{font-size:10px;color:var(--text-muted);margin-bottom:10px;letter-spacing:0.08em}
.popup-mood-badge{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,rgba(192,96,160,0.1),rgba(224,112,96,0.1));border:1px solid rgba(192,96,160,0.2);border-radius:20px;padding:6px 14px;margin-bottom:14px}
.popup-mood-label{font-size:12px;color:var(--accent);font-weight:400;letter-spacing:0.06em}
.popup-body{font-size:15px;color:var(--text);line-height:1.85;font-weight:300}

/* Nav */
.nav{display:flex;background:rgba(255,255,255,0.25);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.4);position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding-bottom:env(safe-area-inset-bottom);z-index:100}
.nav-btn{flex:1;padding:10px 4px 9px;border:none;background:none;color:rgba(255,255,255,0.5);font-size:10px;font-family:var(--font);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color 0.15s;letter-spacing:0.04em}
.nav-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav-btn.active{color:#fff}

/* Toast */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(42,24,48,0.85);backdrop-filter:blur(10px);color:#fff;font-size:12px;padding:10px 20px;border-radius:30px;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;z-index:300;font-family:var(--font);letter-spacing:0.04em}
.toast.show{opacity:1}
.empty{text-align:center;padding:24px;color:var(--text-muted);font-size:13px;line-height:1.7;font-weight:300}
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <div id="screen-home" class="screen active">
    <div class="page-header">
      <h1 id="home-date"></h1>
      <div class="sub" id="home-sub">今日の日記を書こう</div>
    </div>

    <div class="card">
      <div class="card-label">きぶん</div>
      <div class="mood-row">
        <button class="mood-btn" data-mood="great" onclick="selectMood(this)">
          <div class="mood-icon-wrap"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="17" fill="#F4A060"/><circle cx="13" cy="15" r="2.2" fill="#fff"/><circle cx="23" cy="15" r="2.2" fill="#fff"/><path d="M11 22 Q18 29 25 22" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg></div>
          <span class="mood-label">最高</span>
        </button>
        <button class="mood-btn" data-mood="good" onclick="selectMood(this)">
          <div class="mood-icon-wrap"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="17" fill="#D4A850"/><circle cx="13" cy="15" r="2" fill="#fff"/><circle cx="23" cy="15" r="2" fill="#fff"/><path d="M12 22 Q18 27 24 22" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></div>
          <span class="mood-label">よい</span>
        </button>
        <button class="mood-btn" data-mood="okay" onclick="selectMood(this)">
          <div class="mood-icon-wrap"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="17" fill="#80B090"/><circle cx="13" cy="15" r="2" fill="#fff"/><circle cx="23" cy="15" r="2" fill="#fff"/><line x1="12" y1="23" x2="24" y2="23" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg></div>
          <span class="mood-label">ふつう</span>
        </button>
        <button class="mood-btn" data-mood="down" onclick="selectMood(this)">
          <div class="mood-icon-wrap"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="17" fill="#7898C8"/><circle cx="13" cy="14" r="2" fill="#fff"/><circle cx="23" cy="14" r="2" fill="#fff"/><path d="M12 25 Q18 20 24 25" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></div>
          <span class="mood-label">しんどい</span>
        </button>
        <button class="mood-btn" data-mood="hard" onclick="selectMood(this)">
          <div class="mood-icon-wrap"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="17" fill="#C090D0"/><path d="M11 13 Q13 11 15 13" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M21 13 Q23 11 25 13" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M12 25 Q18 20 24 25" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></div>
          <span class="mood-label">つらい</span>
        </button>
      </div>
    </div>

    <div class="card">
      <div class="card-label">モード</div>
      <div class="mode-grid">
        <button class="mode-btn sel" data-mode="ふつう" onclick="selectMode(this)"><div class="mode-pip"></div>ふつう</button>
        <button class="mode-btn" data-mode="ほめ日記" onclick="selectMode(this)"><div class="mode-pip"></div>ほめ日記</button>
        <button class="mode-btn" data-mode="感謝日記" onclick="selectMode(this)"><div class="mode-pip"></div>感謝日記</button>
        <button class="mode-btn" data-mode="写真・絵" onclick="selectMode(this)"><div class="mode-pip"></div>写真・絵</button>
      </div>
    </div>

    <div class="card">
      <div class="card-label" id="textarea-label">今日のこと</div>
      <textarea class="journal-textarea" id="journal-text" placeholder="雑なメモでOK。思ったまま書いてください。"></textarea>
    </div>

    <div class="card" id="otd-card" style="display:none">
      <div class="card-label">1週間前の今日</div>
      <div class="otd-inner">
        <div class="otd-date" id="otd-date"></div>
        <div class="otd-text" id="otd-text"></div>
      </div>
    </div>

    <button class="btn-save" onclick="saveJournal()">保存してフィードバックをもらう</button>

    <div class="ai-card" id="ai-card">
      <div class="ai-header">AIメンターより<div class="ai-header-line"></div></div>
      <div class="ai-body" id="ai-body"></div>
      <div class="ai-question" id="ai-question"></div>
      <div class="ai-reply" id="ai-reply" style="display:none">
        <textarea id="ai-reply-text" placeholder="答えなくてもOK。思ったことがあれば…"></textarea>
        <button class="ai-reply-btn" onclick="sendReply()">送る</button>
      </div>
    </div>
    <div style="height:24px"></div>
  </div>

  <!-- CALENDAR -->
  <div id="screen-calendar" class="screen">
    <div class="cal-header">
      <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
      <h1 id="cal-month-label"></h1>
      <button class="cal-nav-btn" onclick="changeMonth(1)">›</button>
    </div>
    <div class="cal-weekdays">
      <div class="cal-weekday">月</div><div class="cal-weekday">火</div><div class="cal-weekday">水</div>
      <div class="cal-weekday">木</div><div class="cal-weekday">金</div><div class="cal-weekday">土</div><div class="cal-weekday">日</div>
    </div>
    <div class="cal-cells" id="cal-cells"></div>
    <div class="card" style="margin-top:16px">
      <div class="card-label">今月のポジネガ推移</div>
      <div id="mood-chart"></div>
    </div>
  </div>

  <!-- REPORT -->
  <div id="screen-report" class="screen">
    <div class="report-header">
      <h1>週次レポート</h1>
      <div class="sub" id="report-range"></div>
    </div>
    <div class="card">
      <div class="card-label">今週のワードクラウド</div>
      <div class="wordcloud" id="wordcloud"></div>
    </div>
    <div class="card">
      <div class="card-label">ポジネガ感情グラフ</div>
      <div id="report-chart"></div>
    </div>
    <div class="ai-card" id="report-ai" style="display:block;margin:12px 16px 0">
      <div class="ai-header">今週のメンターより<div class="ai-header-line"></div></div>
      <div class="ai-body" id="report-ai-body"><div class="ai-loading"><span></span><span></span><span></span></div></div>
      <div class="ai-question" id="report-ai-q"></div>
    </div>
  </div>

  <nav class="nav">
    <button class="nav-btn active" id="nav-home" onclick="showScreen('home')">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      今日
    </button>
    <button class="nav-btn" id="nav-calendar" onclick="showScreen('calendar')">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      カレンダー
    </button>
    <button class="nav-btn" id="nav-report" onclick="showScreen('report')">
      <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      週次
    </button>
  </nav>
</div>

<div class="popup-bg" id="popup-bg" onclick="closePopup()">
  <div class="popup" onclick="event.stopPropagation()">
    <div class="popup-handle"></div>
    <div class="popup-date" id="popup-date"></div>
    <div id="popup-mood-badge" class="popup-mood-badge"></div>
    <div class="popup-body" id="popup-body"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const MOOD={
  great:{pos:90,neg:10,label:'最高',svg:'<circle cx="18" cy="18" r="17" fill="#F4A060"/><circle cx="13" cy="15" r="2.2" fill="#fff"/><circle cx="23" cy="15" r="2.2" fill="#fff"/><path d="M11 22 Q18 29 25 22" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/>'},
  good:{pos:65,neg:35,label:'よい',svg:'<circle cx="18" cy="18" r="17" fill="#D4A850"/><circle cx="13" cy="15" r="2" fill="#fff"/><circle cx="23" cy="15" r="2" fill="#fff"/><path d="M12 22 Q18 27 24 22" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>'},
  okay:{pos:50,neg:50,label:'ふつう',svg:'<circle cx="18" cy="18" r="17" fill="#80B090"/><circle cx="13" cy="15" r="2" fill="#fff"/><circle cx="23" cy="15" r="2" fill="#fff"/><line x1="12" y1="23" x2="24" y2="23" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>'},
  down:{pos:30,neg:70,label:'しんどい',svg:'<circle cx="18" cy="18" r="17" fill="#7898C8"/><circle cx="13" cy="14" r="2" fill="#fff"/><circle cx="23" cy="14" r="2" fill="#fff"/><path d="M12 25 Q18 20 24 25" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>'},
  hard:{pos:10,neg:90,label:'つらい',svg:'<circle cx="18" cy="18" r="17" fill="#C090D0"/><path d="M11 13 Q13 11 15 13" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M21 13 Q23 11 25 13" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M12 25 Q18 20 24 25" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>'}
};
const WD=['日','月','火','水','木','金','土'];
const WDM=['月','火','水','木','金','土','日'];
let selMood='',selMode='ふつう',calY,calM,aiConv=[];

function todayKey(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function getEnt(){try{return JSON.parse(localStorage.getItem('j4')||'{}')}catch{return{}}}
function saveEnt(k,v){const e=getEnt();e[k]=v;localStorage.setItem('j4',JSON.stringify(e))}
function dlabel(k){const[y,m,d]=k.split('-').map(Number);return`${y}年${m}月${d}日（${WD[new Date(y,m-1,d).getDay()]}）`}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function moodIcon(key,sz=18){const md=MOOD[key];if(!md)return'';return`<svg width="${sz}" height="${sz}" viewBox="0 0 36 36">${md.svg}</svg>`}

function showScreen(n){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+n).classList.add('active');
  document.getElementById('nav-'+n).classList.add('active');
  if(n==='calendar')renderCal();
  if(n==='report')renderReport();
}
function selectMood(el){document.querySelectorAll('.mood-btn').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');selMood=el.dataset.mood}
function selectMode(el){
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');selMode=el.dataset.mode;
  const L={'ふつう':'今日のこと','ほめ日記':'できたこと＋ほめ言葉','感謝日記':'感謝3つ','写真・絵':'一枚と一言'};
  document.getElementById('textarea-label').textContent=L[selMode]||'今日のこと';
}

async function saveJournal(){
  const text=document.getElementById('journal-text').value.trim();
  if(!text){showToast('日記を書いてください');return}
  if(!selMood){showToast('きぶんを選んでください');return}
  const key=todayKey();
  saveEnt(key,{text,mood:selMood,mode:selMode,ts:Date.now()});
  showToast('保存しました ✓');
  const card=document.getElementById('ai-card');
  card.style.display='block';
  document.getElementById('ai-body').innerHTML='<div class="ai-loading"><span></span><span></span><span></span></div>';
  document.getElementById('ai-question').textContent='';
  document.getElementById('ai-reply').style.display='none';
  card.scrollIntoView({behavior:'smooth'});
  aiConv=[];
  await callMentor(text,selMood,selMode,getPast(key));
}

function getPast(tk){
  const ents=getEnt(),res=[],today=new Date(tk);
  [7,14,30].forEach(days=>{
    const p=new Date(today);p.setDate(p.getDate()-days);
    const k=`${p.getFullYear()}-${String(p.getMonth()+1).padStart(2,'0')}-${String(p.getDate()).padStart(2,'0')}`;
    if(ents[k])res.push({daysAgo:days,...ents[k]});
  });
  return res;
}

async function callMentor(text,mood,mode,past){
  const ml=MOOD[mood]?.label||mood;
  const pt=past.length?past.map(e=>`【${e.daysAgo}日前・${MOOD[e.mood]?.label||e.mood}】${e.text.slice(0,80)}`).join('\n'):'なし';
  const sys=`あなたはリンさんの個人ジャーナルのAIメンターです。コーチングスタンスで：価値観・喜びの源泉を拾う、答えを教えない、深い問いかけをする。薄い共感は使わない。短く鋭く。過去と似たテーマがあれば引用。JSONのみ：{"body":"フィードバック（2〜4文）","question":"問いかけ1文"}`;
  aiConv.push({role:'user',content:`今日の日記（${mode}・${ml}）：\n${text}\n\n過去：\n${pt}`});
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:800,system:sys,messages:aiConv})});
    const d=await r.json();
    const raw=d.content?.find(b=>b.type==='text')?.text||'{}';
    aiConv.push({role:'assistant',content:raw});
    let p;try{p=JSON.parse(raw.replace(/```json|```/g,'').trim())}catch{p={body:raw,question:''}}
    document.getElementById('ai-body').textContent=p.body||'';
    document.getElementById('ai-question').textContent=p.question||'';
    if(p.question)document.getElementById('ai-reply').style.display='block';
  }catch{document.getElementById('ai-body').textContent='接続エラーが発生しました。'}
}

async function sendReply(){
  const t=document.getElementById('ai-reply-text').value.trim();if(!t)return;
  aiConv.push({role:'user',content:t});
  document.getElementById('ai-reply-text').value='';
  document.getElementById('ai-question').textContent='';
  document.getElementById('ai-body').innerHTML+='<br><br><div class="ai-loading"><span></span><span></span><span></span></div>';
  const sys=`あなたはリンさんのAIメンターです。コーチングで深い気づきを促す。JSONのみ：{"body":"返答（1〜3文）","question":"次の問い（任意）"}`;
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:500,system:sys,messages:aiConv})});
    const d=await r.json();
    const raw=d.content?.find(b=>b.type==='text')?.text||'{}';
    aiConv.push({role:'assistant',content:raw});
    let p;try{p=JSON.parse(raw.replace(/```json|```/g,'').trim())}catch{p={body:raw,question:''}}
    const be=document.getElementById('ai-body');
    be.innerHTML=be.innerHTML.replace(/<br><br><div class="ai-loading">[\s\S]*?<\/div>/,'');
    be.innerHTML+=`<br><br>${p.body||''}`;
    document.getElementById('ai-question').textContent=p.question||'';
    if(!p.question)document.getElementById('ai-reply').style.display='none';
  }catch{}
}

function renderCal(){
  const now=new Date();
  if(calY===undefined){calY=now.getFullYear();calM=now.getMonth()}
  document.getElementById('cal-month-label').textContent=`${calY}年${calM+1}月`;
  const ents=getEnt(),cells=document.getElementById('cal-cells');
  cells.innerHTML='';
  const first=new Date(calY,calM,1);
  const sd=(first.getDay()+6)%7;
  const days=new Date(calY,calM+1,0).getDate();
  const ts=todayKey();
  for(let i=0;i<sd;i++)cells.innerHTML+='<div></div>';
  for(let d=1;d<=days;d++){
    const k=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const e=ents[k];const isT=k===ts;
    cells.innerHTML+=`<div class="cal-cell${isT?' today':''}${e?' has-entry':''}" ${e?`onclick="showPopup('${k}')"`:''}><div class="cn">${d}</div>${e?`<div class="cm">${moodIcon(e.mood,12)}</div>`:''}</div>`;
  }
  renderMoodChart();
}

function renderMoodChart(){
  const ents=getEnt(),now=new Date();
  if(calY!==now.getFullYear()||calM!==now.getMonth()){document.getElementById('mood-chart').innerHTML='<div class="empty">今月の記録がありません</div>';return}
  const days=new Date(calY,calM+1,0).getDate();
  let html='';
  for(let d=1;d<=Math.min(days,now.getDate());d++){
    const k=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const e=ents[k];if(!e)continue;
    const m=MOOD[e.mood]||{pos:50,neg:50};
    html+=`<div class="chart-row"><span class="chart-label">${d}</span><div class="chart-track"><div class="chart-pos" style="width:${m.pos}%"></div><div class="chart-neg" style="width:${m.neg}%"></div></div><div class="chart-icon">${moodIcon(e.mood,14)}</div></div>`;
  }
  document.getElementById('mood-chart').innerHTML=html||'<div class="empty">まだ記録がありません</div>';
}

function changeMonth(dir){calM+=dir;if(calM>11){calM=0;calY++}if(calM<0){calM=11;calY--}renderCal()}

function showPopup(k){
  const e=getEnt()[k];if(!e)return;
  const md=MOOD[e.mood]||{};
  document.getElementById('popup-date').textContent=dlabel(k);
  document.getElementById('popup-mood-badge').innerHTML=`${moodIcon(e.mood,18)}<span class="popup-mood-label">${md.label||''}</span>`;
  document.getElementById('popup-body').textContent=e.text;
  document.getElementById('popup-bg').classList.add('show');
}
function closePopup(){document.getElementById('popup-bg').classList.remove('show')}

async function renderReport(){
  const ents=getEnt(),today=new Date(),days=[];
  for(let i=6;i>=0;i--){
    const d=new Date(today);d.setDate(d.getDate()-i);
    const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    days.push({key:k,day:WDM[(d.getDay()+6)%7],entry:ents[k]});
  }
  const s=days[0].key.slice(5).replace('-','/'),en=days[6].key.slice(5).replace('-','/');
  document.getElementById('report-range').textContent=`${s} 〜 ${en}`;
  let chart='';
  days.forEach(({day,entry})=>{
    const m=entry?(MOOD[entry.mood]||{pos:50,neg:50}):null;
    chart+=`<div class="chart-row"><span class="chart-label">${day}</span><div class="chart-track">${m?`<div class="chart-pos" style="width:${m.pos}%"></div><div class="chart-neg" style="width:${m.neg}%"></div>`:''}</div><div class="chart-icon">${entry?moodIcon(entry.mood,14):''}</div></div>`;
  });
  document.getElementById('report-chart').innerHTML=chart;
  const allText=days.filter(d=>d.entry).map(d=>d.entry.text).join(' ');
  if(allText){renderWC(allText);await genWeekly(days)}
  else{document.getElementById('wordcloud').innerHTML='<div class="empty">今週の日記がありません</div>';document.getElementById('report-ai-body').textContent='今週の日記がありません。'}
}

function renderWC(text){
  const stop=new Set(['は','が','を','に','で','の','と','も','だ','た','て','い','な','か','し','れ','ら','こ','あ','ん','う','え','お','そ','さ','せ','す','って','から','ため','という','など','また','でも','ので','ます','です','ました','した','ない','する','ある','いる','いた','なる','なった','なって','思う','思い','思った','今日','今週','今','自分','こと','もの','とき']);
  const freq={};
  text.replace(/[、。！？\n\r]/g,' ').split(/[\s　]+/).forEach(w=>{w=w.trim();if(w.length>=2&&!stop.has(w))freq[w]=(freq[w]||0)+1});
  const sorted=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,14);
  if(!sorted.length){document.getElementById('wordcloud').innerHTML='<div class="empty">まだデータがありません</div>';return}
  const max=sorted[0][1],min=sorted[sorted.length-1][1];
  document.getElementById('wordcloud').innerHTML=sorted.map(([w,c])=>{
    const r=(c-min)/Math.max(max-min,1);
    const sz=Math.round(34+r*38);const fs=Math.round(11+r*9);const op=(0.65+r*0.35).toFixed(2);
    return`<span class="wc-bubble" style="width:${sz}px;height:${sz}px;font-size:${fs}px;opacity:${op}">${w}</span>`;
  }).join('');
}

async function genWeekly(days){
  const entries=days.filter(d=>d.entry);if(!entries.length)return;
  const summary=entries.map(d=>`${d.day}: ${MOOD[d.entry.mood]?.label||d.entry.mood} — ${d.entry.text.slice(0,80)}`).join('\n');
  const sys=`あなたはリンさんのAIメンターです。週次コーチング：価値観・喜びの源泉・繰り返しパターンを拾う。JSONのみ：{"body":"週次フィードバック（3〜4文）","question":"問いかけ1文"}`;
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:600,system:sys,messages:[{role:'user',content:`今週：\n${summary}`}]})});
    const d=await r.json();
    const raw=d.content?.find(b=>b.type==='text')?.text||'{}';
    let p;try{p=JSON.parse(raw.replace(/```json|```/g,'').trim())}catch{p={body:raw,question:''}}
    document.getElementById('report-ai-body').textContent=p.body||'';
    document.getElementById('report-ai-q').textContent=p.question||'';
  }catch{document.getElementById('report-ai-body').textContent='接続エラーが発生しました。'}
}

function initHome(){
  const now=new Date();
  document.getElementById('home-date').textContent=`${now.getMonth()+1}月${now.getDate()}日（${WD[now.getDay()]}）`;
  const key=todayKey(),ents=getEnt();
  if(ents[key]){
    document.getElementById('journal-text').value=ents[key].text;
    document.getElementById('home-sub').textContent='今日の日記 ― 編集できます';
    selMood=ents[key].mood;
    document.querySelectorAll('.mood-btn').forEach(b=>{if(b.dataset.mood===selMood)b.classList.add('sel')});
  }
  const w=new Date(now);w.setDate(w.getDate()-7);
  const wk=`${w.getFullYear()}-${String(w.getMonth()+1).padStart(2,'0')}-${String(w.getDate()).padStart(2,'0')}`;
  if(ents[wk]){
    document.getElementById('otd-card').style.display='block';
    document.getElementById('otd-date').textContent=dlabel(wk);
    document.getElementById('otd-text').textContent=ents[wk].text.slice(0,120)+(ents[wk].text.length>120?'…':'');
  }
}
initHome();
</script>
